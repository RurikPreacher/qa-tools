<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>qa-tools · Useful utilities</title>
<style>:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#64748b;--line:#dbe2eb;--accent:#2563eb}:root[data-theme=dark]{color-scheme:dark;--bg:#0c1220;--panel:#151e2e;--ink:#e6edf7;--muted:#9aabc2;--line:#304058;--accent:#78a8ff}*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);margin:0}header{background:var(--panel);border-bottom:1px solid var(--line)}nav{max-width:1000px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}button{cursor:pointer;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 14px;font:inherit}main{max-width:1000px;margin:65px auto;padding:0 24px}h1{font-size:clamp(32px,5vw,48px);letter-spacing:-.04em;margin:0 0 12px}p{color:var(--muted);line-height:1.6}h2{margin:38px 0 16px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.tile{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;transition:border-color .15s,transform .15s}.tile:hover{border-color:var(--accent);transform:translateY(-2px)}.tile h3{margin:0 0 8px}.tile p{margin:0 0 18px;font-size:14px}.link{color:var(--accent);font-size:14px;font-weight:650}@media(max-width:560px){main{margin:35px auto}}</style></head>
<body><header><nav><strong>qa-tools</strong><button id="theme" type="button" aria-label="Toggle color theme">Theme</button></nav></header><main><h1>Useful tools for QA and beyond.</h1><p>Small, practical utilities that run directly in your browser. No account required.</p><h2>Tools</h2><div class="grid"><a class="tile" href="./tools/test-file-generator/"><h3>QA Test File Generator</h3><p>Create ready-to-run Windows commands for dummy files from 1 MB to 10 GB.</p><span class="link">Open tool →</span></a></div></main>
<script>(()=>{let t;try{t=localStorage.getItem('qa-tools.theme')}catch{}const b=document.getElementById('theme');function set(v){document.documentElement.dataset.theme=v;b.textContent=v==='dark'?'☀ Light':'☾ Dark';try{localStorage.setItem('qa-tools.theme',v)}catch{}}set(t==='dark'||t==='light'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));b.onclick=()=>set(document.documentElement.dataset.theme==='dark'?'light':'dark')})()</script></body></html>
